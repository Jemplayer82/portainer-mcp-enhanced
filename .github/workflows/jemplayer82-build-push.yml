name: Build and push jemplayer82 fork image

# Fork-local workflow (not part of the upstream project). Builds the plain
# source Dockerfile (not the GoReleaser one, which needs release-only
# secrets we don't have here) and pushes a pinned, immutable image so
# downstream consumers (e.g. portainer-mcp-shared) never depend on a
# moving :latest tag.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          SHA_SHORT="${GITHUB_SHA::12}"
          echo "sha_short=${SHA_SHORT}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          file: Dockerfile
          push: true
          build-args: |
            VERSION=${{ steps.tags.outputs.sha_short }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          tags: |
            ghcr.io/jemplayer82/portainer-mcp-enhanced:${{ steps.tags.outputs.sha_short }}
            ghcr.io/jemplayer82/portainer-mcp-enhanced:latest
